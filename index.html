function exerciseView(){let muscles=['All','Back','Shoulders','Chest','Quads','Hamstrings','Glutes','Biceps','Triceps','Core','Calves','Full Body','Cardio','Mobility'];return `<div class="badhdr"><div><div class="micro">LIFT DATABASE</div><h1 style="margin-top:6px">Exercises</h1></div><button class="btn smol primary" data-act="newExercise">${ico('plus',15)} Custom</button></div><p class="muted" style="margin:10px 0 6px">Browse real video demonstrations and technique cues. No incorrect motion placeholders. Add or customise movements whenever you want.</p><div class="search" style="margin:18px 0 10px">${ico('chart',16)}<input id="exerciseSearch" type="search" placeholder="Search exercises…" value="${esc(searchTerm)}"/></div><div class="row" style="overflow:auto;gap:6px;padding-bottom:12px">${muscles.map(m=>`<button class="chip" style="white-space:nowrap;${searchMuscle===m?'border-color:#6aa7ff;color:white;background:#254677':''}" data-act="muscleFilter" data-v="${m}">${m}</button>`).join('')}</div><div class="card" id="exerciseList">${listExercises()}</div>`}
function listExercises(){return allEx().filter(e=>(searchMuscle==='All'||e.muscle===searchMuscle)&&e.name.toLowerCase().includes(searchTerm.toLowerCase())).map(e=>`<div class="exercise-choice">${demoMini(e.id)}<div class="grow"><h3>${esc(e.name)}</h3><p class="muted" style="font-size:11px">${esc(e.muscle)} · ${esc(e.equipment)}</p></div><button class="btn smol demo-open" data-act="demo" data-v="${esc(e.id)}" title="Watch exercise demonstration">▶ Video</button>${data.customExercises.some(x=>x.id===e.id)?`<button class="btn smol secondary" data-act="editCustomEx" data-v="${esc(e.id)}">Edit</button>`:`<button class="btn smol secondary" data-act="cloneEx" data-v="${esc(e.id)}">Customize</button>`}<button class="btn smol" data-act="exHistory" data-v="${esc(e.id)}">${ico('chart',16)}</button></div>`).join('')||'<div class="empty">No exercises found.</div>'}

function hkRound(x,n=0){return Number.isFinite(+x)?Number(x).toFixed(n):'—'}
function hkDisplay(v,unit='',digits=0){return v==null||!Number.isFinite(+v)?'—':hkRound(v,digits)+(unit?' '+unit:'')}
function hkDayName(d){try{return new Date(d+'T12:00:00').toLocaleDateString('en-BE',{weekday:'short'})}catch(e){return d.slice(-2)}}
function hkTrendMetric(d,name,unit,decimals=0){return `<div class="hkMetric"><div class="micro">${name}</div><div class="val">${hkDisplay(d?.[name], '', decimals)}</div><small>${esc(unit)}</small></div>`}
function hkStat(label,value,caption){return `<div class="hkMetric"><div class="micro">${esc(label)}</div><div class="val">${esc(value)}</div><small>${esc(caption)}</small></div>`}
function hkBars(days,key,max=10){let list=days.slice(0,7).reverse(),m=Math.max(max,...list.map(d=>Number(d[key])||0));return `<div class="hkHistory">${list.map(d=>`<div class="hkDay" title="${esc(d.date)}: ${hkDisplay(d[key])}"><div class="b" style="height:${Math.round(5+Math.max(0,(+d[key]||0))/m*83)}px;opacity:${d[key]==null?'.19':'1'}"></div><label>${hkDayName(d.date)}</label></div>`).join('')}</div>`}
function hkReadiness(days){
 // Trend-based contextual flag, not a validated readiness score or diagnostic.
 const current=days[0]||{},hist=days.slice(1,29);
 const validHRV=hist.filter(x=>x.hrvMs>0),validRHR=hist.filter(x=>x.restingBpm>0);
 if(validHRV.length<5||validRHR.length<5||!(current.hrvMs>0)||!(current.restingBpm>0)||!(current.sleepMinutes>0))return {title:'Building your baseline',color:'blue',desc:'At least five previous days of HRV and resting heart rate, plus last night’s sleep, are needed for recovery context.'};
 const baseHRV=validHRV.reduce((a,b)=>a+b.hrvMs,0)/validHRV.length,baseRHR=validRHR.reduce((a,b)=>a+b.restingBpm,0)/validRHR.length;
 let flags=[];if(current.hrvMs < baseHRV*.8)flags.push('HRV is lower than usual');if(current.restingBpm>baseRHR+6)flags.push('resting heart rate is elevated');if(current.sleepMinutes<360)flags.push('sleep duration was short');
 return flags.length?{title:'Extra recovery may help',color:'orange',desc:flags.join(' · ')+'. Use this as a trend, not an instruction to skip training.'}:{title:'Metrics near your baseline',color:'green',desc:'No major deviation in HRV, resting heart rate or sleep duration by these simple thresholds. It is not a medical clearance or a validated recovery score.'}
}
function recoveryView(){const h=data.health,days=(h?.days||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)),t=days.find(d=>d.date===localDate())||days[0],r=hkReadiness(days),syncReady=!!window.webkit?.messageHandlers?.health;
 return `<div class="micro">APPLE HEALTH · BADR LIFT</div><h1 style="margin:6px 0 0">Sleep & recovery</h1><p class="muted" style="margin:12px 0 16px">Your Apple Watch measurements, alongside your training. Data stays on your iPhone.</p>
 <div class="hkHero"><div class="row between" style="gap:8px;align-items:start"><span class="pill ${h?'green':'dim'}">${h?'● HEALTH DATA IMPORTED':'● NOT CONNECTED'}</span><button class="btn smol secondary" data-act="healthSync">${ico('heart',15)} ${h?'Sync now':'Connect Apple Health'}</button></div><div class="micro" style="margin-top:17px">RECOVERY INDICATORS</div><h2>${h?esc(r.title):'Your health dashboard awaits'}</h2><p>${h?esc(r.desc):'To show real watch data, this web app needs its companion iPhone HealthKit app. Safari and home-screen web apps cannot directly request Apple Health data.'}</p>${h?`<p style="margin-top:10px">Last synced: ${esc(new Date(h.updatedAt).toLocaleString('en-BE'))} · ${esc(h.source||'Apple Health')}</p>`:''}</div>
 <div class="section-header"><h2>Last night’s sleep</h2><span class="micro">${t?esc(t.date):'NO DATA'}</span></div>
 <div class="grid2">${hkStat('TOTAL SLEEP',t?.sleepMinutes!=null?`${hkRound(t.sleepMinutes/60,1)} h`:'—','hours asleep')}${hkStat('DEEP SLEEP',t?.deepMinutes!=null?`${Math.round(t.deepMinutes)} min`:'—','deep / slow-wave')}${hkStat('REM SLEEP',t?.remMinutes!=null?`${Math.round(t.remMinutes)} min`:'—','dreaming stage')}${hkStat('CORE SLEEP',t?.coreMinutes!=null?`${Math.round(t.coreMinutes)} min`:'—','light sleep')}</div>
 <div class="card" style="margin-top:12px"><div class="row between"><h3>Sleep trend</h3><span class="micro">PAST 7 DAYS</span></div>${hkBars(days,'sleepMinutes',450)}<div class="hkInfo">Hours slept each night; amounts are shown as a relative chart. Apple Watch sleep staging is an estimate.</div></div>
 <div class="section-header"><h2>Recovery metrics</h2><span class="micro">PERSONAL TRENDS</span></div>
 <div class="grid2">${hkStat('HRV',hkDisplay(t?.hrvMs,'ms',0),'Heart rate variability (SDNN)')}${hkStat('RESTING HR',hkDisplay(t?.restingBpm,'bpm',0),'Resting heart rate')}${hkStat('RESPIRATION',hkDisplay(t?.respiratoryRate,'/min',1),'Breaths per minute')}${hkStat('WRIST TEMP.',hkDisplay(t?.wristTempC,'°C',1),'Absolute wrist measurement, when available')}</div>
 <div class="section-header"><h2>Activity & energy</h2><span class="micro">TODAY</span></div>
 <div class="grid2">${hkStat('STEPS',t?.steps==null?'—':Math.round(t.steps).toLocaleString('en-BE'),'daily total')}${hkStat('ACTIVE ENERGY',hkDisplay(t?.activeKcal,'kcal'),'Apple Health estimate')}${hkStat('EXERCISE TIME',hkDisplay(t?.exerciseMinutes,'min'),'movement / exercise')}${hkStat('WATCH WORKOUTS',t?.workouts==null?'—':String(t.workouts),'sessions recorded')}</div>
 <div class="card" style="margin-top:15px"><h3>Apple Health connection</h3><p class="hkInfo" style="margin:9px 0 15px">${syncReady?'The native iPhone HealthKit bridge is available. Tap Sync now to refresh measurements from Apple Health.':'This standalone HTML version tracks workouts, but cannot access Apple Health directly. Use the included native iOS project to enable actual Apple Watch syncing. No data shown here is invented.'}</p>${h?'<button class="btn smol red" data-act="healthClear">Clear imported health data</button>':''}</div>
 <p class="footnote">Recovery indicators are a simple comparison with your recent HRV, heart-rate and sleep baseline. Not a validated score, diagnosis or medical advice. HealthKit data never uploads to a server in this build.</p>`
}
function requestHealthSync(){const bridge=window.webkit?.messageHandlers?.health;if(bridge){bridge.postMessage({action:'sync'});toast('Asking Apple Health for permitted data…')}else alert('Direct Apple Health sync requires the native iPhone companion app. The Safari/PWA version cannot read HealthKit. The ZIP includes iOS Swift source to enable it with Xcode.');}
window.badrLiftHealthReceive=function(payload){try{const p=typeof payload==='string'?JSON.parse(payload):payload;if(!p||!Array.isArray(p.days)||p.days.some(x=>!/^\d{4}-\d{2}-\d{2}$/.test(x.date)))throw Error('Invalid HealthKit response');data.health={source:'Apple Health',updatedAt:new Date().toISOString(),days:p.days.slice(0,45)};save();if(page==='recovery')render();toast('Apple Health data updated')}catch(e){console.error(e);toast('Health sync failed: '+e.message)}};
window.badrLiftHealthError=function(message){toast('Apple Health: '+String(message||'Unable to sync'))};

if(modal==='editRoutineEx'){let t=data.templates.find(x=>x.id===editingTemplate),l=t?.list[+modalTarget];if(!l){modal='routine';return renderModal()}html=`<div class="modalhead"><h2>${esc(getEx(l.id).name)}</h2><button class="overlay-close" data-act="closeModal">×</button></div><div class="field"><label>Number of sets</label><input id="lSets" type="number" min="1" max="12" value="${l.sets}"/></div>${exType(l.id)==='strength'?`<div class="field"><label>Rest (seconds)</label><input id="lRest" type="number" min="0" max="600" step="15" value="${l.rest}"/></div>`:`<div class="field"><label>Default target duration (minutes)</label><input id="lMinutes" type="number" min="0" max="240" step="0.5" value="${l.minutes||0}"/></div>`}<button class="btn primary wide" data-act="saveRoutineEx">Save exercise targets</button><button class="btn ghost wide" style="margin-top:8px" data-act="backRoutine">Back</button>`}

if(modal==='exerciseOptions'){const e=data.active?.exercises[+modalTarget];if(!e){modal='';return renderModal()}html=`<div class="modalhead"><h2>${esc(getEx(e.id).name)}</h2><button class="overlay-close" data-act="closeModal">×</button></div><div class="field"><label>Rest after each set (seconds)</label><input id="exRest" type="number" min="0" max="600" step="15" value="${e.rest}"/></div><div class="field"><label>Exercise notes</label><textarea id="exNote" rows="3" placeholder="Cues, machine settings, etc.">${esc(e.note||'')}</textarea></div><button class="btn primary wide" data-act="saveExOptions">Save options</button><div class="row" style="margin-top:11px"><button class="btn grow" data-act="removeLastSet">Remove last set</button><button class="btn red grow" data-act="removeExercise">Remove exercise</button></div>`}
if(modal==='sessionNote'){html=`<div class="modalhead"><h2>Session notes</h2><button class="overlay-close" data-act="closeModal">×</button></div><div class="field"><label>Workout name</label><input id="sessionName" value="${esc(data.active?.name||'Free workout')}"/></div><div class="field"><textarea id="sessionNotes" rows="5" placeholder="How did you feel? Recovery, soreness, or progression notes…">${esc(data.active?.note||'')}</textarea></div><button class="btn primary wide" data-act="saveSessionNote">Save notes</button>`}
if(modal==='historyDetail'){let s=data.history.find(x=>x.id===historyDetail);if(!s){modal='';return renderModal()}html=`<div class="modalhead"><div><div class="micro">${niceDate(s.finishedAt)}</div><h2>${esc(s.name)}</h2></div><button class="overlay-close" data-act="closeModal">×</button></div><div class="grid3" style="margin-bottom:14px"><div class="card stat"><div class="micro">Sets</div><div class="num">${sessionDone(s)}</div></div><div class="card stat"><div class="micro">Volume</div><div class="num">${fmt(sessionVol(s)/1000)}</div><div class="sub">tonnes</div></div><div class="card stat"><div class="micro">Time</div><div class="num" style="font-size:17px">${timeFmt(duration(s))}</div></div></div>${s.exercises.map(e=>`<div class="listrow" style="display:block"><h3>${esc(getEx(e.id).name)}</h3><p style="margin-top:6px">${e.sets.filter(z=>z.done).map(z=>logText(e.id,z)).join(' | ')||'No sets completed'}</p>${e.note?`<p>${esc(e.note)}</p>`:''}</div>`).join('')}${s.note?`<p class="muted" style="margin-top:15px">${esc(s.note)}</p>`:''}<button class="btn red wide" style="margin-top:15px" data-act="deleteHistory" data-v="${s.id}">Delete workout</button>`}
if(modal==='exHistory'){let id=exerciseDetail,ex=getEx(id),type=exType(id);let hist=histMaxEx(id);let max=Math.max(1,...hist.map(x=>x.top));
const activityEntries=data.history.flatMap(s=>s.exercises.filter(e=>e.id===id).flatMap(e=>e.sets.filter(z=>z.done)));
const activityMins=activityEntries.reduce((a,z)=>a+(+z.minutes||0),0);
const activityKm=activityEntries.reduce((a,z)=>a+(+z.km||0),0);
html=`<div class="modalhead"><div><div class="micro">${esc(ex.muscle)} · ${esc(ex.equipment)}</div><h2>${esc(ex.name)}</h2></div><button class="overlay-close" data-act="closeModal">×</button></div>${type==='strength'?`<div class="grid2"><div class="card stat"><div class="micro">HEAVIEST SET</div><div class="num">${fmt(conv(bestKg(id)))}</div><div class="sub">${unit()}</div></div><div class="card stat"><div class="micro">EST. 1 REP MAX</div><div class="num">${fmt(conv(bestE1(id)))}</div><div class="sub">${unit()} · Epley estimate</div></div></div><div class="card" style="margin-top:13px"><div class="micro">HEAVIEST SET BY SESSION</div><div class="bars">${hist.length?hist.map(x=>`<div class="bar-item"><div class="v" title="${fmt(conv(x.top))} ${unit()}" style="height:${x.top/max*86}px"></div><span class="lab">${niceDay(x.date)}</span></div>`).join(''):'<div class="empty">Complete this exercise to see your trend.</div>'}</div></div>`:`<div class="grid2"><div class="card stat"><div class="micro">TOTAL TIME</div><div class="num">${fmt(activityMins)}</div><div class="sub">minutes logged</div></div><div class="card stat"><div class="micro">${type==='cardio'?'TOTAL DISTANCE':'COMPLETED ENTRIES'}</div><div class="num">${type==='cardio'?fmt(activityKm):activityEntries.length}</div><div class="sub">${type==='cardio'?'km':'sessions / sets'}</div></div></div>`}<p class="muted" style="font-size:12px;margin:16px 0 10px">Last session: ${esc(exercisePrevious(id))}</p><button class="btn wide secondary" data-act="demo" data-v="${esc(id)}">▶ Watch real demonstration</button><a class="btn wide" style="margin-top:8px" target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/results?search_query=${encodeURIComponent(ex.name+' exercise form technique')}">Find technique videos ↗</a>`}

root.innerHTML=`<div class="modal-scrim ${modal==='demo'?'demo-modal':''}" data-act="backdrop"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;}
function pickerResults(){return allEx().filter(e=>(pickerType==='All'||(e.type||'strength')===pickerType.toLowerCase())&&e.name.toLowerCase().includes(searchTerm.toLowerCase())).slice(0,140).map(e=>`<div class="exercise-choice">${demoMini(e.id)}<div class="grow"><h3>${esc(e.name)}</h3><p class="muted" style="font-size:11px">${esc(e.muscle)} · ${esc(e.equipment)}</p></div><button class="btn smol" data-act="demo" data-v="${esc(e.id)}">▶</button><button class="btn smol secondary" data-act="selectExercise" data-v="${esc(e.id)}">Add ${ico('plus',14)}</button></div>`).join('')||'<div class="empty">No movements found. Create your own below.</div>'}
function startEmpty(){if(data.active&&!confirm('You already have an active workout. Discard it and start a new one?'))return;data.active={id:'s'+Date.now(),name:'Free workout',templateId:null,startedAt:Date.now(),restUntil:0,note:'',exercises:[]};save();nav('session')}
function startWorkout(id){if(data.active){if(!confirm('You already have an active workout. Discard it and start a new one?'))return}let t=data.templates.find(x=>x.id===id);if(!t)return;data.active={id:'s'+Date.now(),name:t.name,templateId:t.id,startedAt:Date.now(),restUntil:0,note:'',exercises:t.list.map(e=>{let prev=latestSets(e.id);return {id:e.id,rest:e.rest??data.settings.rest,note:'',sets:Array.from({length:e.sets},(_,i)=>newSet(e.id,prev[i]||prev[0]||{minutes:e.minutes||0}))}})};save();nav('session')}
function finish(){if(!data.active)return;const count=sessionDone(data.active);if(!count){alert('Log at least one completed set or activity before finishing.');return}if(!confirm(`Save this workout with ${count} completed set${count!==1?'s':''}?`))return;data.active.finishedAt=Date.now();data.history.push(data.active);data.active=null;save();nav('history');toast('Workout saved. Nice work!')}
function getAct(el){let b=el.closest('[data-act]');return b&&{act:b.dataset.act,v:b.dataset.v};}
function listen(){document.addEventListener('click',e=>{const info=getAct(e.target);if(!info)return;const {act,v}=info;let t=data.templates.find(x=>x.id===editingTemplate);try{switch(act){
case'demo':demoReturnModal=modal;demoId=v;modal='demo';renderModal();break;
case'editDemoLink':modal='videoLink';renderModal();break;
case'saveDemoLink':{const v=$('#customDemoUrl').value.trim();if(v&&!extractYouTubeId(v)&&!/^https:\/\/[^\s"'<>]+\.(mp4|webm|ogg)(?:\?[^\s"'<>]*)?$/i.test(v)){toast('Use an exact YouTube URL or direct HTTPS .mp4/.webm link.');break;}if(v)(data.videoLinks||= {})[demoId]=v;else delete (data.videoLinks||{})[demoId];save();modal='demo';renderModal();toast('Video link saved');break;}
case'clearDemoLink':delete (data.videoLinks||{})[demoId];save();modal='demo';renderModal();toast('Custom link removed');break;
case'addFromDemo':if(demoReturnModal==='picker'&&modalTarget==='routine'){let t=data.templates.find(x=>x.id===editingTemplate);if(t){t.list.push({id:v,sets:exType(v)==='strength'?3:1,rest:data.settings.rest,...(exType(v)!=='strength'?{minutes:0}:{})});save();modal='routine';renderModal();toast('Added to routine')}break;}if(data.active){let id=v,prev=latestSets(id);data.active.exercises.push({id,rest:data.settings.rest,note:'',sets:Array.from({length:exType(id)==='strength'?3:1},(_,i)=>newSet(id,prev[i]||prev[0]))});save();modal='';nav('session');toast('Exercise added')}else{modal='';nav('workouts');toast('Start a workout, then add this exercise')}break;
case'nav':nav(v);break;case'applyPlan':if(confirm('Replace only the stock A–D and optional cardio routines with the revised V4 plan? Custom routines and workout history will stay intact.'))installRecommendedPlan();break;case'healthSync':requestHealthSync();break;case'healthClear':if(confirm('Clear imported Apple Health readings on this device? Workout records will remain.')){delete data.health;save();render()}break;case'startEmpty':startEmpty();break;case'backdrop':if(e.target.classList.contains('modal-scrim')){modal='';renderModal()}break;case'closeModal':modal=modal==='videoLink'?'demo':((modal==='demo'&&demoReturnModal==='picker')?'picker':'');renderModal();break;case'startTemplate':startWorkout(v);break;case'finishWorkout':finish();break;case'discardWorkout':if(confirm('Discard this workout and all its uncompleted sets?')){data.active=null;save();nav('workouts')}break;
case'addSet':{let ex=data.active?.exercises[+v];if(!ex)break;const prev=ex.sets.at(-1);ex.sets.push(newSet(ex.id,prev));save();render();break}
case'toggleSet':{let [i,j]=v.split(':').map(Number),ex=data.active?.exercises[i],set=ex?.sets[j];if(!set)break;if(!set.done && (exType(ex.id)==='strength'?(!Number.isFinite(+set.reps)||+set.reps<=0):(!Number.isFinite(+set.minutes)||+set.minutes<=0))){toast(exType(ex.id)==='strength'?'Enter reps before completing the set':'Enter duration in minutes first');break}set.done=!set.done;if(set.done&&exType(ex.id)==='strength')data.active.restUntil=Date.now()+(ex.rest||data.settings.rest)*1000;save();render();break}
case'restAdd':if(data.active){data.active.restUntil=Math.max(Date.now(),data.active.restUntil||0)+(+v)*1000;save();updateClocks()}break;
case'restSkip':if(data.active){data.active.restUntil=0;save();updateClocks()}break;
case'sessionNote':modal='sessionNote';renderModal();break;
case'saveSessionNote':if(data.active){data.active.name=$('#sessionName').value.trim()||data.active.name;data.active.note=$('#sessionNotes').value;save()}modal='';renderModal();toast('Session notes saved');break;
case'addExerciseActive':modalTarget='active';searchTerm='';pickerType='All';modal='picker';renderModal();break;
case'pickerFilter':pickerType=v;renderModal();break;
case'addExerciseRoutine':{if(t){t.name=$('#routineName').value.trim()||t.name;t.focus=$('#routineFocus').value;t.note=$('#routineNote').value;save()}modalTarget='routine';searchTerm='';modal='picker';renderModal();break}
case'selectExercise':if(modalTarget==='active'&&data.active){let id=v;let prev=latestSets(id);data.active.exercises.push({id,rest:data.settings.rest,note:'',sets:Array.from({length:exType(id)==='strength'?3:1},(_,i)=>newSet(id,prev[i]||prev[0]))});save();modal='';render();toast('Exercise added')}else if(modalTarget==='routine'&&t){t.list.push({id:v,sets:exType(v)==='strength'?3:1,rest:data.settings.rest,...(exType(v)!=='strength'?{minutes:0}:{})});save();modal='routine';renderModal()}break;
case'exerciseOptions':modalTarget=+v;modal='exerciseOptions';renderModal();break;
case'saveExOptions':{let ex=data.active?.exercises[+modalTarget];if(ex){ex.rest=Math.max(0,Math.min(600,+$('#exRest').value||0));ex.note=$('#exNote').value;save()}modal='';render();break}
case'removeLastSet':{let ex=data.active?.exercises[+modalTarget];if(ex?.sets.length>1){ex.sets.pop();save()}modal='';render();break}
case'removeExercise':if(confirm('Remove exercise from this session?')){data.active.exercises.splice(+modalTarget,1);save();modal='';render()}break;
case'historyDetail':historyDetail=v;modal='historyDetail';renderModal();break;
case'exHistory':exerciseDetail=v;modal='exHistory';renderModal();break;
case'deleteHistory':if(confirm('Delete this completed workout permanently?')){data.history=data.history.filter(s=>s.id!==v);save();modal='';render()}break;
case'levelRange':levelRange=+v;render();break;case'bodyView':muscleView=v;render();break;
case'muscleFilter':searchMuscle=v;render();break;
case'newRoutine':{const id='r'+Date.now();data.templates.push({id,name:'New Routine',focus:'CUSTOM',note:'',list:[]});editingTemplate=id;save();modal='routine';renderModal();break}
case'editRoutine':editingTemplate=v;modal='routine';renderModal();break;
case'saveRoutine':if(t){t.name=$('#routineName').value.trim()||'Untitled workout';t.focus=$('#routineFocus').value.trim();t.note=$('#routineNote').value.trim();save();toast('Routine saved')}modal='';render();break;
case'backRoutine':modal='routine';renderModal();break;
case'editRoutineEx':{if(t){t.name=$('#routineName').value.trim()||t.name;t.focus=$('#routineFocus').value;t.note=$('#routineNote').value;save()}modalTarget=+v;modal='editRoutineEx';renderModal();break}
case'saveRoutineEx':{let e=t?.list[+modalTarget];if(e){e.sets=Math.max(1,Math.min(12,+$('#lSets').value||3));if(exType(e.id)==='strength')e.rest=Math.max(0,Math.min(600,+$('#lRest').value||0));else e.minutes=Math.max(0,Math.min(240,+$('#lMinutes').value||0));save()}modal='routine';renderModal();break}
case'moveRoutineEx':{if(t){let [i,d]=v.split(':').map(Number),j=i+d;if(j>=0&&j<t.list.length){[t.list[i],t.list[j]]=[t.list[j],t.list[i]];save();renderModal()}}break}
case'deleteRoutineEx':if(t){t.list.splice(+v,1);save();renderModal()}break;
case'deleteRoutine':if(confirm('Delete this routine? Your past sessions will remain.')){data.templates=data.templates.filter(x=>x.id!==editingTemplate);save();modal='';render()}break;
case'newExercise':modal='newExercise';renderModal();break;
case'saveCustomEx':{let name=$('#customName').value.trim();if(name.length<2){alert('Please enter an exercise name.');break}let id='c'+Date.now();data.customExercises.push({id,name,muscle:$('#customMuscle').value,equipment:$('#customEquip').value,type:$('#customType').value,range:$('#customRange').value||'8–12'});save();modal='';render();toast('Custom exercise created');break}
case'editCustomEx':exerciseDetail=v;modal='editCustomEx';renderModal();break;
case'cloneEx':exerciseDetail=v;modal='cloneEx';renderModal();break;
case'saveEditedEx':{let ex=data.customExercises.find(e=>e.id===exerciseDetail);if(!ex)break;let name=$('#customName').value.trim();if(name.length<2){toast('Please enter an exercise name');break}Object.assign(ex,{name,type:$('#customType').value,muscle:$('#customMuscle').value,equipment:$('#customEquip').value,range:$('#customRange').value.trim()||'8–12'});save();modal='';render();toast('Exercise updated');break}
case'archiveCustomEx':if(confirm('Archive this exercise? Your past history will stay intact.')){let ex=data.customExercises.find(e=>e.id===exerciseDetail);if(ex){ex.archived=true;save()}modal='';render();toast('Exercise archived')}break;
case'addWeight':{let kg=Number($('#weighKg').value),waist=$('#weighWaist').value?Number($('#weighWaist').value):null,date=$('#weighDate').value,note=$('#weighNote').value;if(!(kg>=20&&kg<=400)||!date){toast('Enter a valid date and weight');break}if(waist!==null&&!(waist>=40&&waist<=200)){toast('Waist must be between 40–200 cm');break}data.measurements.push({id:'m'+Date.now(),date,kg,waist,note});save();render();toast('Body measurement saved');break}
case'deleteWeight':if(confirm('Delete this measurement?')){data.measurements=data.measurements.filter(x=>x.id!==v);save();render()}break;
case'exportJson':download('Badr_Lift_backup_'+localDate()+'.json',JSON.stringify(data,null,2),'application/json');toast('Backup ready');break;
case'exportCsv':exportCsv();break;
case'importJson':$('#importFile').click();break;
case'resetData':if(confirm('This erases ALL training history, routines and measurements on this device. Export a backup first. Continue?')&&confirm('Last confirmation: permanently delete your tracker data?')){data=defaults();save();nav('today')}break;
}}catch(err){console.error(err);toast('Something went wrong: '+err.message)}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.field){const ex=data.active?.exercises[+el.dataset.ex],set=ex?.sets[+el.dataset.si];if(!set)return;let v=el.value.trim()===''?null:Number(el.value);if(v!==null&&(!Number.isFinite(v)||v<0)){toast('Please enter a positive number');return}if(el.dataset.field==='weight')set.kg=v===null?0:fromUnit(v);if(el.dataset.field==='reps')set.reps=v===null?0:Math.max(0,Math.floor(v));if(el.dataset.field==='rir')set.rir=v===null?null:Math.min(10,Math.max(0,v));if(el.dataset.field==='minutes')set.minutes=v===null?0:Math.round(v*100)/100;if(el.dataset.field==='distance')set.km=v===null?0:Math.round(v*1000)/1000;save()}
if(el.dataset.setting){let k=el.dataset.setting;data.settings[k]=k==='unit'?el.value:Number(el.value);save();render();toast('Preference saved')}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='exerciseSearch'){searchTerm=el.value;$('#exerciseList').innerHTML=listExercises()}if(el.id==='pickerSearch'){searchTerm=el.value;$('#pickerResults').innerHTML=pickerResults()}});
$('#importFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(obj.version!==1||!Array.isArray(obj.templates)||!Array.isArray(obj.history)||!Array.isArray(obj.measurements))throw new Error('Unsupported or invalid backup');if(!confirm('Import backup? This replaces all tracker data on this device.'))return;obj.templates=obj.templates.filter(t=>!(t.id==='e'&&t.name==='CrossFit · Conditioning'));migrateTrainingPlan(obj);data=obj;save();nav('today');toast('Backup restored successfully')}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}})}
function download(filename,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCsv(){const lines=[['date','session','exercise','muscle','type','entry','weight_kg','reps','rir','duration_min','distance_km','exercise_notes','session_notes']];for(const s of data.history){for(const e of s.exercises){e.sets.forEach((z,i)=>{if(z.done)lines.push([new Date(s.finishedAt).toISOString(),s.name,getEx(e.id).name,getEx(e.id).muscle,exType(e.id),i+1,z.kg??'',z.reps??'',z.rir??'',z.minutes??'',z.km??'',e.note||'',s.note||''])})}}const csv=lines.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');download('Badr_Lift_workouts_'+localDate()+'.csv',csv,'text/csv;charset=utf-8');toast('Workout CSV exported')}

function updateClocks(){let s=data.active;if(!s)return;let c=$('#workClock');if(c)c.textContent=timeFmt(duration(s));let r=$('#restClock');if(r){let left=(s.restUntil||0)-Date.now();r.textContent=left>0?timeFmt(left):'READY';r.style.color=left>0?'#7cf0bb':'#adc2dc'}}
listen();render();setInterval(updateClocks,1000);if('serviceWorker'in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
